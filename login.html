<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Siddharth Shinde | Admin Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #080808;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        .login-box {
            width: 390px;
            padding: 40px;
            background: #111;
            border: 1px solid #292929;
            border-radius: 18px;
        }

        .logo {
            width: 55px;
            height: 55px;
            border-radius: 14px;
            background: #c6ff00;
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 18px;
            margin-bottom: 28px;
        }

        .label {
            color: #c6ff00;
            font-size: 10px;
            letter-spacing: 3px;
            font-weight: 800;
        }

        h1 {
            font-size: 30px;
            margin: 9px 0;
        }

        .subtitle {
            color: #888;
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 12px;
            margin-bottom: 8px;
            color: #ccc;
        }

        input {
            width: 100%;
            padding: 14px;
            background: #080808;
            color: white;
            border: 1px solid #333;
            border-radius: 8px;
            outline: none;
        }

        input:focus {
            border-color: #c6ff00;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #c6ff00;
            color: #000;
            font-weight: 800;
            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            opacity: 0.9;
        }

        #message {
            margin-top: 16px;
            font-size: 12px;
            color: #ff7777;
            text-align: center;
            min-height: 18px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #777;
            text-decoration: none;
            font-size: 12px;
        }

        .back:hover {
            color: white;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">SS</div>

        <p class="label">PRIVATE ACCESS</p>

        <h1>Welcome back.</h1>

        <p class="subtitle">
            Login to manage Siddharth Shinde's portfolio.
        </p>

        <form id="loginForm">

            <div class="field">
                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required>
            </div>

            <div class="field">
                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required>
            </div>

            <button type="submit">
                Login to Dashboard
            </button>

        </form>

        <p id="message"></p>

        <a href="index.html" class="back">
            ← Back to Portfolio
        </a>

    </div>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
    import { getAuth,signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB-CzRPp1VCjTOvnuBN1u0k2WR1t5tBdzs",
        authDomain: "siddharth-portfolio-7acd1.firebaseapp.com",
        projectId: "siddharth-portfolio-7acd1",
        storageBucket: "siddharth-portfolio-7acd1.firebasestorage.app",
        messagingSenderId: "28762666864",
        appId: "1:28762666864:web:28dcc97d9588b62a4b01b5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const loginForm = document.getElementById("loginForm");
    const message = document.getElementById("message");

    loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        message.textContent = "Logging in...";

        try {
            await signInWithEmailAndPassword(auth, email, password);

            window.location.href = "admin.html";

        } catch (error) {
            message.textContent = "Invalid email or password.";
        }
    });
</script>
</body>

</html>
